<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid #21262d;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        header span {
            font-size: 12px;
            color: #7d8590;
            margin-left: auto;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message.user {
            background: #1f6feb;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: #161b22;
            border: 1px solid #21262d;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.thinking {
            background: #161b22;
            border: 1px solid #21262d;
            align-self: flex-start;
            color: #7d8590;
            font-style: italic;
            font-size: 13px;
        }

        #input-area {
            padding: 16px 24px;
            border-top: 1px solid #21262d;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #prompt {
            flex: 1;
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 12px 16px;
            color: #e6edf3;
            font-size: 14px;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            outline: none;
            font-family: inherit;
        }

        #prompt:focus { border-color: #1f6feb; }
        #prompt::placeholder { color: #7d8590; }

        #send-btn {
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            height: 48px;
            white-space: nowrap;
        }

        #send-btn:hover { background: #388bfd; }
        #send-btn:disabled { background: #21262d; color: #7d8590; cursor: not-allowed; }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #7d8590;
        }

        .empty-state h2 { font-size: 20px; color: #e6edf3; }
        .empty-state p { font-size: 14px; }

        .suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }

        .suggestion {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            color: #e6edf3;
        }

        .suggestion:hover { border-color: #1f6feb; color: #388bfd; }
    </style>
</head>
<body>

<header>
    <h1>☕ Java AI Assistant</h1>
    <span>Powered by Catalyst GLM</span>
</header>

<div id="chat-container">
    <div class="empty-state" id="empty-state">
        <h2>Ask me anything about Java</h2>
        <p>Spring Boot, microservices, DevOps, cloud — I've got you.</p>
        <div class="suggestions">
            <div class="suggestion" onclick="ask('What is Spring Boot?')">What is Spring Boot?</div>
            <div class="suggestion" onclick="ask('How does @Autowired work?')">How does @Autowired work?</div>
            <div class="suggestion" onclick="ask('Explain microservices in Java')">Explain microservices</div>
            <div class="suggestion" onclick="ask('What is Docker used for?')">What is Docker?</div>
        </div>
    </div>
</div>

<div id="input-area">
    <textarea id="prompt" placeholder="Ask a Java question..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">Ask</button>
</div>

<script>
    // Step 1: Replace this with your function URL from catalyst deploy output
    // It looks like: https://YOUR-PROJECT.development.catalystserverless.com/server/llm-function/ask
    const FUNCTION_URL = "https://project-rainfall-60076411433.development.catalystserverless.in/server/llm-function/ask";

    const chatContainer = document.getElementById("chat-container");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");

    // Send message when user presses Enter (Shift+Enter adds a new line)
    promptInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Called when user clicks a suggestion chip
    function ask(text) {
        promptInput.value = text;
        sendMessage();
    }

    // Creates a chat bubble and adds it to the screen
    function addMessage(text, role) {
        const emptyState = document.getElementById("empty-state");
        if (emptyState) emptyState.remove();

        const msg = document.createElement("div");
        msg.className = `message ${role}`;
        msg.textContent = text;
        chatContainer.appendChild(msg);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return msg;
    }

    // Removes the <think> block the model sometimes adds internally
    function cleanResponse(raw) {
        return raw.replace(/<think>[\s\S]*?<\/think>/g, "").trim();
    }

    async function sendMessage() {
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        promptInput.value = "";
        sendBtn.disabled = true;

        addMessage(prompt, "user");
        const thinking = addMessage("Thinking...", "thinking");

        try {
            // Send the prompt to the Java function as plain text
            const res = await fetch(FUNCTION_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: prompt
            });

            const data = await res.json();
            thinking.remove();

            // Extract the response text and display it
            const raw = data.response || data.error || "No response";
            addMessage(cleanResponse(raw), "assistant");

        } catch (err) {
            thinking.remove();
            addMessage("Error: " + err.message, "assistant");
        } finally {
            sendBtn.disabled = false;
            promptInput.focus();
        }
    }
</script>

</body>
</html>
